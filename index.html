<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phil's Grills - Premium Electric Grills & Accessories</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .hero-section {
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                  url('https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=1200') center/cover no-repeat;
      color: #fff;
      padding: 100px 20px;
    }
    .product-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15) !important;
    }
    .product-img-container {
      height: 220px;
      overflow: hidden;
      background-color: #eee;
    }
    .product-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .navbar-brand-logo {
      font-weight: 800;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [view, setView] = useState('home');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [products, setProducts] = useState([]);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [cart, setCart] = useState([]);
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 10;

      // Fetch products.json on mount
      useEffect(() => {
        fetch('products.json')
          .then(res => res.json())
          .then(data => setProducts(data))
          .catch(err => console.error("Error loading products:", err));
      }, []);

      // Navigation handler
      const navigateTo = (newView, category = 'All', product = null) => {
        setView(newView);
        setCategoryFilter(category);
        setCurrentPage(1);
        if (product) setSelectedProduct(product);
        window.scrollTo(0, 0);
      };

      // Cart operations
      const addToCart = (item) => {
        setCart(prev => {
          const existingIndex = prev.findIndex(c => 
            c.id === item.id && c.selectedColor === item.selectedColor && c.selectedPower === item.selectedPower
          );
          if (existingIndex > -1) {
            const updated = [...prev];
            updated[existingIndex].quantity += item.quantity;
            return updated;
          }
          return [...prev, item];
        });
        alert(`Added ${item.name} to your cart!`);
      };

      const updateQuantity = (index, delta) => {
        setCart(prev => {
          const updated = [...prev];
          const newQty = updated[index].quantity + delta;
          if (newQty <= 0) return updated;
          updated[index].quantity = newQty;
          return updated;
        });
      };

      const removeFromCart = (index) => {
        setCart(prev => prev.filter((_, i) => i !== index));
      };

      const totalCartItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      // Filtered products list
      const filteredProducts = categoryFilter === 'All' 
        ? products 
        : products.filter(p => p.category === categoryFilter);

      return (
        <div>
          {/* Navigation Bar */}
          <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
            <div class="container">
              <a class="navbar-brand navbar-brand-logo text-warning" href="#" onClick={(e) => { e.preventDefault(); navigateTo('home'); }}>
                <i class="bi bi-fire me-2"></i>Phil's Grills
              </a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <button class={`nav-link btn btn-link ${view === 'home' ? 'active fw-bold text-warning' : ''}`} onClick={() => navigateTo('home')}>Home</button>
                  </li>
                  
                  {/* Shop Dropdown */}
                  <li class="nav-item dropdown">
                    <a class={`nav-link dropdown-toggle btn btn-link ${view === 'shop' ? 'active fw-bold text-warning' : ''}`} href="#" id="shopDropdown" role="button" data-bs-toggle="dropdown">
                      Shop
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark">
                      <li><a class="dropdown-item" href="#" onClick={(e) => { e.preventDefault(); navigateTo('shop', 'All'); }}>All Products</a></li>
                      <li><a class="dropdown-item" href="#" onClick={(e) => { e.preventDefault(); navigateTo('shop', 'Electric Grills'); }}>Electric Grills</a></li>
                      <li><a class="dropdown-item" href="#" onClick={(e) => { e.preventDefault(); navigateTo('shop', 'Covers & Tools'); }}>Covers & Tools</a></li>
                      <li><a class="dropdown-item" href="#" onClick={(e) => { e.preventDefault(); navigateTo('shop', 'Parts & Grates'); }}>Parts & Grates</a></li>
                    </ul>
                  </li>

                  <li class="nav-item">
                    <button class={`nav-link btn btn-link ${view === 'account' || view === 'createAccount' ? 'active fw-bold text-warning' : ''}`} onClick={() => navigateTo('account')}>Account</button>
                  </li>
                </ul>
                <button class="btn btn-outline-warning position-relative" onClick={() => navigateTo('cart')}>
                  <i class="bi bi-cart-fill me-1"></i> Cart
                  {totalCartItems > 0 && (
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                      {totalCartItems}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </nav>

          {/* Main View Router */}
          <main>
            {view === 'home' && <HomeView onShopClick={() => navigateTo('shop', 'All')} products={products} onSelectProduct={(p) => navigateTo('detail', 'All', p)} />}
            {view === 'shop' && (
              <ShopView 
                products={filteredProducts} 
                categoryFilter={categoryFilter}
                currentPage={currentPage} 
                setCurrentPage={setCurrentPage} 
                itemsPerPage={itemsPerPage} 
                onSelectProduct={(p) => navigateTo('detail', categoryFilter, p)} 
              />
            )}
            {view === 'detail' && <ProductDetailView product={selectedProduct} onAddToCart={addToCart} onBack={() => navigateTo('shop', categoryFilter)} />}
            {view === 'account' && <AccountView onCreateAccountClick={() => navigateTo('createAccount')} />}
            {view === 'createAccount' && <CreateAccountView onLoginClick={() => navigateTo('account')} />}
            {view === 'cart' && <CartView cart={cart} updateQuantity={updateQuantity} removeFromCart={removeFromCart} subtotal={cartSubtotal} onShopClick={() => navigateTo('shop', 'All')} />}
          </main>

          {/* Footer */}
          <footer class="bg-dark text-light py-4 mt-5">
            <div class="container text-center">
              <p class="mb-1">&copy; 2026 Phil's Grills - Modern Electric Outdoor Cooking.</p>
              <small class="text-muted">CSUEB Web Development Project 1 | Built with React & Bootstrap 5</small>
            </div>
          </footer>
        </div>
      );
    }

    // HOME VIEW COMPONENT
    function HomeView({ onShopClick, products, onSelectProduct }) {
      const featured = products.filter(p => p.featuredProduct).slice(0, 3);

      return (
        <div>
          <div class="hero-section text-center">
            <div class="container">
              <h1 class="display-3 fw-bold mb-3">Power Your Next BBQ with Phil's Grills</h1>
              <p class="lead mb-4">Precision temperature control, zero propane hassle, authentic smokehouse results.</p>
              <button class="btn btn-warning btn-lg px-5 text-dark fw-bold" onClick={onShopClick}>Shop All Products</button>
            </div>
          </div>

          <div class="container my-5">
            <h2 class="text-center mb-4 font-weight-bold">Featured Electric Grills & Gear</h2>
            <div class="row g-4">
              {featured.map(product => (
                <div class="col-md-4" key={product.id}>
                  <div class="card h-100 shadow-sm product-card" onClick={() => onSelectProduct(product)}>
                    <div class="product-img-container">
                      <img src={product.image} alt={product.name} />
                    </div>
                    <div class="card-body">
                      <span class="badge bg-danger mb-2">Featured</span>
                      <h5 class="card-title">{product.name}</h5>
                      <p class="card-text text-muted">{product.description}</p>
                      <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fs-5 fw-bold text-dark">${product.price.toFixed(2)}</span>
                        <span class="btn btn-sm btn-outline-warning text-dark">View Details</span>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // SHOP VIEW COMPONENT (Includes Pagination & Category Header)
    function ShopView({ products, categoryFilter, currentPage, setCurrentPage, itemsPerPage, onSelectProduct }) {
      const totalPages = Math.ceil(products.length / itemsPerPage);
      const startIndex = (currentPage - 1) * itemsPerPage;
      const currentProducts = products.slice(startIndex, startIndex + itemsPerPage);

      return (
        <div class="container my-5">
          <h2 class="mb-4">
            Phil's Catalog - {categoryFilter === 'All' ? 'All Products' : categoryFilter} ({products.length} Items)
          </h2>
          
          {products.length === 0 ? (
            <div class="alert alert-info py-4 text-center">
              <h4>No products found in this category.</h4>
            </div>
          ) : (
            <ProductList products={currentProducts} onSelectProduct={onSelectProduct} />
          )}

          {/* Pagination Controls */}
          {totalPages > 1 && (
            <nav class="mt-5">
              <ul class="pagination justify-content-center">
                <li class={`page-item ${currentPage === 1 ? 'disabled' : ''}`}>
                  <button class="page-link" onClick={() => setCurrentPage(p => p - 1)}>Previous</button>
                </li>
                {[...Array(totalPages)].map((_, i) => (
                  <li key={i} class={`page-item ${currentPage === i + 1 ? 'active' : ''}`}>
                    <button class="page-link" onClick={() => setCurrentPage(i + 1)}>{i + 1}</button>
                  </li>
                ))}
                <li class={`page-item ${currentPage === totalPages ? 'disabled' : ''}`}>
                  <button class="page-link" onClick={() => setCurrentPage(p => p + 1)}>Next</button>
                </li>
              </ul>
            </nav>
          )}
        </div>
      );
    }

    // PRODUCT LIST COMPONENT
    function ProductList({ products, onSelectProduct }) {
      return (
        <div class="row g-4">
          {products.map(product => (
            <div class="col-12 col-md-6 col-lg-4" key={product.id}>
              <ProductCard product={product} onSelectProduct={onSelectProduct} />
            </div>
          ))}
        </div>
      );
    }

    // PRODUCT CARD COMPONENT
    function ProductCard({ product, onSelectProduct }) {
      return (
        <div class="card h-100 shadow-sm product-card" onClick={() => onSelectProduct(product)}>
          <div class="product-img-container">
            <img src={product.image} alt={product.name} />
          </div>
          <div class="card-body d-flex flex-column">
            <small class="text-muted">{product.category}</small>
            <h5 class="card-title mt-1">{product.name}</h5>
            <p class="card-text text-muted flex-grow-1">{product.description}</p>
            <div class="mt-3">
              <span class="badge bg-secondary me-2">{product.size}</span>
              <span class="text-warning"><i class="bi bi-star-fill"></i> {product.rating} ({product.numberOfReviews})</span>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
              <span class="fs-5 fw-bold">${product.price.toFixed(2)}</span>
              <button class="btn btn-sm btn-warning">View Details</button>
            </div>
          </div>
        </div>
      );
    }

    // PRODUCT DETAIL VIEW COMPONENT
    function ProductDetailView({ product, onAddToCart, onBack }) {
      if (!product) return null;

      const [selectedPower, setSelectedPower] = useState(product.powerOptions[0] || '');
      const [selectedColor, setSelectedColor] = useState(product.colors[0] || '');
      const [quantity, setQuantity] = useState(1);

      const handleAdd = (e) => {
        e.preventDefault();
        onAddToCart({
          id: product.id,
          name: product.name,
          image: product.image,
          price: product.price,
          selectedPower,
          selectedColor,
          quantity: parseInt(quantity, 10)
        });
      };

      return (
        <div class="container my-5">
          <button class="btn btn-outline-secondary mb-4" onClick={onBack}>
            <i class="bi bi-arrow-left"></i> Back to Catalog
          </button>
          
          <div class="row g-5">
            <div class="col-md-6">
              <img src={product.image} alt={product.name} class="img-fluid rounded shadow" />
            </div>
            <div class="col-md-6">
              <h2>{product.name}</h2>
              <p class="text-muted">SKU: {product.sku} | Brand: {product.brand}</p>
              <h3 class="text-success fw-bold mb-3">${product.price.toFixed(2)}</h3>
              <p class="lead">{product.longDescription}</p>

              <hr />

              <form onSubmit={handleAdd}>
                <div class="mb-3">
                  <label class="form-label fw-bold">Power Option:</label>
                  <select class="form-select" value={selectedPower} onChange={(e) => setSelectedPower(e.target.value)}>
                    {product.powerOptions.map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Color / Finish:</label>
                  <select class="form-select" value={selectedColor} onChange={(e) => setSelectedColor(e.target.value)}>
                    {product.colors.map((c, i) => <option key={i} value={c}>{c}</option>)}
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Quantity:</label>
                  <input 
                    type="number" 
                    class="form-control" 
                    min="1" 
                    max={product.quantityInStock} 
                    value={quantity} 
                    onChange={(e) => setQuantity(e.target.value)} 
                    required 
                  />
                </div>

                <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold mt-3">
                  <i class="bi bi-cart-plus-fill me-2"></i> Add to Cart
                </button>
              </form>

              <div class="mt-4 p-3 bg-light rounded border">
                <h5>Product Specifications</h5>
                <ul class="mb-0 text-muted">
                  <li><strong>Heating Surface:</strong> {product.size}</li>
                  <li><strong>Heating Element:</strong> {product.heatingElement}</li>
                  <li><strong>Temperature Range:</strong> {product.temperatureRange}</li>
                  <li><strong>Voltage:</strong> {product.voltage}</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // CART VIEW COMPONENT
    function CartView({ cart, updateQuantity, removeFromCart, subtotal, onShopClick }) {
      if (cart.length === 0) {
        return (
          <div class="container my-5 text-center">
            <i class="bi bi-cart-x display-1 text-muted"></i>
            <h3 class="mt-3">Your Shopping Cart is Empty</h3>
            <p class="text-muted">Looks like you haven't added any grills or gear yet.</p>
            <button class="btn btn-warning mt-3 fw-bold" onClick={onShopClick}>Explore Store</button>
          </div>
        );
      }

      return (
        <div class="container my-5">
          <h2 class="mb-4"><i class="bi bi-cart-check me-2"></i> Shopping Cart</h2>
          <div class="row g-4">
            <div class="col-lg-8">
              {cart.map((item, index) => (
                <CartItem key={index} item={item} index={index} updateQuantity={updateQuantity} removeFromCart={removeFromCart} />
              ))}
            </div>
            <div class="col-lg-4">
              <div class="card shadow-sm p-3">
                <h4 class="card-title">Order Summary</h4>
                <hr />
                <div class="d-flex justify-content-between mb-2">
                  <span>Subtotal:</span>
                  <span class="fw-bold">${subtotal.toFixed(2)}</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                  <span>Estimated Shipping:</span>
                  <span class="text-success fw-bold">FREE</span>
                </div>
                <hr />
                <div class="d-flex justify-content-between mb-3 fs-5">
                  <strong>Total:</strong>
                  <strong class="text-success">${subtotal.toFixed(2)}</strong>
                </div>
                <button class="btn btn-warning w-100 fw-bold" onClick={() => alert("Checkout simulated!")}>Proceed to Checkout</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // CART ITEM COMPONENT
    function CartItem({ item, index, updateQuantity, removeFromCart }) {
      return (
        <div class="card mb-3 shadow-sm">
          <div class="card-body d-flex align-items-center">
            <img src={item.image} alt={item.name} style={{ width: '80px', height: '80px', objectFit: 'cover' }} class="rounded me-3" />
            <div class="flex-grow-1">
              <h5 class="mb-1">{item.name}</h5>
              <small class="text-muted me-3">Power: {item.selectedPower}</small>
              <small class="text-muted">Color: {item.selectedColor}</small>
              <div class="mt-2 fw-bold text-dark">${item.price.toFixed(2)} each</div>
            </div>
            <div class="d-flex align-items-center me-4">
              <button class="btn btn-sm btn-outline-secondary me-2" onClick={() => updateQuantity(index, -1)}>-</button>
              <span class="fw-bold">{item.quantity}</span>
              <button class="btn btn-sm btn-outline-secondary ms-2" onClick={() => updateQuantity(index, 1)}>+</button>
            </div>
            <div class="text-end me-3">
              <div class="fw-bold fs-5">${(item.price * item.quantity).toFixed(2)}</div>
            </div>
            <button class="btn btn-outline-danger btn-sm" onClick={() => removeFromCart(index)}>
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      );
    }

    // ACCOUNT VIEW COMPONENT
    function AccountView({ onCreateAccountClick }) {
      return (
        <div class="container my-5" style={{ maxWidth: '450px' }}>
          <div class="card shadow-sm p-4">
            <h3 class="card-title text-center mb-4">Sign In</h3>
            <form onSubmit={(e) => { e.preventDefault(); alert("Login submitted."); }}>
              <div class="mb-3">
                <label class="form-label">Username / Email</label>
                <input type="text" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" required />
              </div>
              <button type="submit" class="btn btn-dark w-100 fw-bold">Login</button>
            </form>
            <hr class="my-4" />
            <p class="text-center mb-0">Don't have an account?</p>
            <button class="btn btn-outline-warning text-dark w-100 fw-bold mt-2" onClick={onCreateAccountClick}>Create New Account</button>
          </div>
        </div>
      );
    }

    // CREATE ACCOUNT VIEW COMPONENT
    function CreateAccountView({ onLoginClick }) {
      const [formData, setFormData] = useState({
        username: '',
        email: '',
        password: '',
        street: '',
        city: '',
        state: '',
        zip: '',
        phone: ''
      });

      const [errors, setErrors] = useState({});

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const validate = () => {
        const newErrors = {};

        if (!formData.username.trim()) newErrors.username = "Username is required";
        if (!formData.password || formData.password.length < 6) newErrors.password = "Password must be at least 6 characters";
        
        const emailRegex = /\S+@\S+\.\S+/;
        if (!emailRegex.test(formData.email)) newErrors.email = "Valid email is required";

        if (formData.zip && !/^\d{5}$/.test(formData.zip)) {
          newErrors.zip = "Zip code must be 5 digits";
        }

        if (formData.phone && !/^\d{10}$/.test(formData.phone.replace(/\D/g, ''))) {
          newErrors.phone = "Phone must be a valid 10-digit number";
        }

        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (validate()) {
          alert("Account created successfully!");
          onLoginClick();
        }
      };

      return (
        <div class="container my-5" style={{ maxWidth: '600px' }}>
          <div class="card shadow-sm p-4">
            <h3 class="card-title text-center mb-3">Create Phil's Grills Account</h3>
            <p class="text-muted text-center mb-4">Please fill in your details below.</p>
            
            <form onSubmit={handleSubmit} noValidate>
              <h5 class="text-warning bg-dark p-2 rounded">Required Information</h5>
              
              <div class="mb-3">
                <label class="form-label">Username *</label>
                <input type="text" name="username" class={`form-control ${errors.username ? 'is-invalid' : ''}`} value={formData.username} onChange={handleChange} />
                {errors.username && <div class="invalid-feedback">{errors.username}</div>}
              </div>

              <div class="mb-3">
                <label class="form-label">Email Address *</label>
                <input type="email" name="email" class={`form-control ${errors.email ? 'is-invalid' : ''}`} value={formData.email} onChange={handleChange} />
                {errors.email && <div class="invalid-feedback">{errors.email}</div>}
              </div>

              <div class="mb-3">
                <label class="form-label">Password *</label>
                <input type="password" name="password" class={`form-control ${errors.password ? 'is-invalid' : ''}`} value={formData.password} onChange={handleChange} />
                {errors.password && <div class="invalid-feedback">{errors.password}</div>}
              </div>

              <h5 class="text-warning bg-dark p-2 rounded mt-4">Optional Address Information</h5>

              <div class="mb-3">
                <label class="form-label">Street Address</label>
                <input type="text" name="street" class="form-control" value={formData.street} onChange={handleChange} />
              </div>

              <div class="row">
                <div class="col-md-5 mb-3">
                  <label class="form-label">City</label>
                  <input type="text" name="city" class="form-control" value={formData.city} onChange={handleChange} />
                </div>
                <div class="col-md-3 mb-3">
                  <label class="form-label">State</label>
                  <input type="text" name="state" class="form-control" value={formData.state} onChange={handleChange} />
                </div>
                <div class="col-md-4 mb-3">
                  <label class="form-label">Zip Code</label>
                  <input type="text" name="zip" class={`form-control ${errors.zip ? 'is-invalid' : ''}`} value={formData.zip} onChange={handleChange} />
                  {errors.zip && <div class="invalid-feedback">{errors.zip}</div>}
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class={`form-control ${errors.phone ? 'is-invalid' : ''}`} value={formData.phone} onChange={handleChange} />
                {errors.phone && <div class="invalid-feedback">{errors.phone}</div>}
              </div>

              <button type="submit" class="btn btn-warning w-100 fw-bold mt-3">Register Account</button>
            </form>
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
